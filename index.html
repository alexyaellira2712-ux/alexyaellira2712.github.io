<template id="fulltext"><h2>El feminismo y la ilustración</h2>
<h3>Los primeros pasos del feminismo</h3>
<p>La ilustración se consolidó en la historia como un parteaguas para sin fin de movimientos sociales, desde las independencias de las naciones americanas, hasta un fenómenos que se había sembrado como propuesta desde tiempo antes: el papel de la mujer en la sociedad.</p>
<p>No fue escasa la participación de las mujeres en complejos procesos históricos, sin embargo, la pregunta detonadora parte del cuestionamiento, ¿cuál era su posición dentro de dichos movimientos? Una mujer no era considerada una igual a un hombre, basados en el condicionamiento social que se terminó apoyando de consensos que evolucionaron de determinismos religiosos a determinismos científicos, con el intento de reducir a las mujeres a un papel inamovible e incuestionable.</p>
<p>La intención era mantener a la mujer en el papel de sumisión frente al hombre, sea su esposo, su padre, la figura patriarcal de Dios, todo fundamentado por la maternidad. Este último se prometía como el único fin en la vida de una mujer, a parte de una entrega total a un convento, cuestionado firmemente por figuras ilustradas.</p>
<p>Nombres como Fray Benito Jerónimo Feijoo fueron partícipes en un nuevo planteamiento hacia la mirada del intelectual bajo la manifestación del “debate de los sexos”, enunciando su postura en “la defensa de la mujer”, con aseveraciones peligrosas como que “el alma no es varón ni hembra”, y que no existía un fundamento en afirmar que una mujer era menos capaz intelectualmente que el varón, descartando la “singularidad” o la “excelencia” como casos destacables dentro de la producción de pensadores.</p>
<p>Desde el mundo clásico hasta el Antiguo Régimen existieron mujeres presentes en las esferas intelectuales, ejemplos como Hypatia de Alejandría, Christine de Pizan, hasta llegar a Mary Wollstonecraf o Olympe de Gouges han cruzado por estos espacios dominados por la presencia masculina; no obstante, la afirmación de que “el feminismo nace con la ilustración” nos propone un nuevo camino que niega la herencia determinista de la feminidad y propone una investigación para resolver porqué los nombres femeninos en la sabiduría eran considerablemente reducidos.</p>
<p>Entre las instancias predominantes de lo masculino, como los salones, la academia, la sociedad política, lo que manejaba el mundo, empezaron a surgir figuras femeninas que incomodaron al estatus quo de la Europa, que saliendo del Antiguo Régimen, pretendía la revolución tanto ideológica como material de sus formas de vivir.</p>
<p>Todo esto fue motivado por la firme pero negada herramienta de la educación. Este fue un punto de no retorno hacia el camino de la visibilidad femenina, a pesar de que la forma tradicional de instruir a las mujeres fuera centrada en la instrucción de una esposa y madre bien formada para el hogar, no con la producción activa de sabiduría. Aún así, el acceso a la lectura y la posibilidad de crear círculos de pensadoras supuso un punto y aparte dentro de las formas de presentar a una mujer, con constantes intentos de desprestigiar las causas que se concibieron a partir de estos espacios.</p>
<p>Aquí mismo no sólo nos acercaremos al alumbramiento de estas sociedades femeninas dentro de la sociabilidad europea, sino que encontramos en este camino más cuestionamientos que complementan la visibilización femenina en este rico proceso histórico.</p>
<p>¿Dónde estaban las mujeres pobres? ¿Cuál era el contraste dentro de las clases? ¿Ellas tenían acceso al privilegio de la educación? ¿Ya podemos hablar de la cuestión racial?</p>
<h3>Las nuevas formas de sociabilidad</h3>
<h3>Los salones</h3>
<p>El salón del siglo XVIII tiene sus antecedentes en la Francia del siglo XVII y será el hotel de Rambuillet, y su famoso chambre bleue el lugar invocado cuando se quiere concretar la aparición de una nueva forma de socialización. Catherine de Vivonne, la joven marquesa de Rambuillet, diseño su nueva casa, permitiendo la decoracion menos convencional, para que un número variable de personas pudieran disfrutar del placer de la palabra y la tertulia que se desarrollaba en torno a la cama desde donde la anfitriona, aquejada de una rara enfermedad, dirige la conversación.</p>
<p>Al atraer a la élite social e intelectual francesa la marquesa de Rambuillet, había inventado el salón, un espacio donde mujeres de talento y con una cultura relevante podían reunirse con los hombres de iguales cualidades para disfrutar de una gran variedad de temas artísticos e intelectuales.Hombres consagrados como Richelieu se encontraron en sus salones donde podrián manifestar sus inquietudes o mostrar sus obras.</p>
<p>El movimiento de las preciosas nació ahí en los salones donde rechazaban todo el amor físico a cambio de poder dedicar toda su energía al cultivo del espíritu.</p>
<p>No todos los salones siguieron la misma pauta del preciosismo, muchas de ellas usaron su sexualidad como un ingrediente más para atraer a hombres importantes.</p>
<p>En la segunda mitad del siglo XVIII, todas las grandes ciudades europeas contaban con ellos, la mayor parte patrocinados por una dama bella, en los cuales tanto hombres y mujeres escapaban de la rigidez social de la época. España no fue la excepción , las cortes de España jugaron un papel importante. (debate politicos)</p>
<p>Se convirtieron en mecenas intelectuales, se propiciaron debates religiosos o se representaban obras teatrales también se organizaban conciertos.</p>
<p>Se hicieron obras que fueron diseñadas para dar de comer a pobres de forma económica y eficaz.( hambruna de madrid 1798).</p>
<p>Se enmarcaron sus actores en un contexto liberal o ilustrado. En las tertulias se comentaban los libros recién llegados de Francia, la actriz de moda o los azares de la política.</p>
<p>Por primera vez algunas mujeres, las pertenecientes a una capa social privilegiada, fueron protagonistas y pudieron convertir espacios privados en semipúblicos en los que se escucho su voz. En los salones se dirimen aspectos importantes de la vida del país.</p>
<h3>Academias y sociedades</h3>
<p>Estas instituciones fueron creadas por la sociedad del siglo XVIII para dar respuesta a las nuevas necesidades. Las academias de carácter científico no excluyen a las mujeres, sin embargo no era muy frecuente que acudieron.</p>
<p>Las mujeres aceptadas lo fueron las que tenían calidad y características que las asemejaba en cualidades al varón.</p>
<p>El debate en torno a la admisión de las damas se desarrolló en el seno de la Real Sociedad Económica Matritense entre 1775 y 1787, defensa iniciada por Jose Manuel Marin. (pionero de la defensa de la admisión de las damas)</p>
<p>La lucha por la admisión se llevó a cabo tanto por hombres como mujeres ya que creían en la posibilidad de reformar la sociedad con buenas leyes y proyectos ; el amor a la patria y la felicidad pública eran sus objetivos y su fe en el progreso estaba anclado en la educación de los seres humanos. Apelaban a argumentos de utilidad acompañada de la consideración de igual capacidad intelectual y educación común a los dos sexos.</p>
<p>La admisión fomentaría la jardinería, la economía rural y doméstica; impulsada por las artes y los oficios, educaría a sus hijos como ciudadanos útiles y serían ejemplo para sus criadas y para todas las mujeres. Era importante lograr el modelo de madre e hija educada. ( ejercer derechos ciudadanos). El reformismo ilustrado no llegaba más lejos, una cosa era entreabrir un espacio y otra era el reconocimiento de derechos ciudadanos de las mujeres.</p>
<p>Si se admitía la igualdad de los sexos, la lógica llevaba no solo a la presencia de las mujeres en la sociedad Económica sino en todos los lugares que los hombres receptores de los mismos derechos venían ocupando.</p>
<p>La junta de las damas, que en 1788 contaba ya con 22 socias, elaboró unos estatutos donde definían con claridad sus funciones y derechos. Dispuestas a colaborar con la mejora de las manufacturas nacionales de modo que esta ayudará a reducir importaciones. Elaboraron informes de la industria y se ofrecieron a mejorar la preparación de la mano de obra femenina. Les encomendaron fundar la Escuela Patriótica También se emprendió la labor de impartir clases a las niñas de familias humildes lo cual no tuvo mucho éxito.</p>
<p>efectos</p>
<p>-Conseguir actos y mostrarlos como virtudes para mujeres de las capas inferiores.</p>
<p>-Asistencia de las presas de las Galeras</p>
<p>-Asistencia religiosa y a la s embarazadas</p>
<p>- Mejorar la salud y la vida material de las reclusas, darles una formación para que se reinsertaran a la sociedad.</p>
<p>-Salubridad de los edificios</p>
<h3>Los paseos como espacio de sociabilidad, control y agencia femenina en el siglo XVIII</h3>
<p>El paseo dieciochesco no fue un simple lugar de esparcimiento: fue el punto donde chocaban dos fuerzas contrarias del siglo XVIII español y europeo. Por un lado, un discurso normativo, eclesiástico, higienista y político, que insistía en recluir a la mujer en el ámbito doméstico. Por otro, una práctica social real en la que las mujeres ganaban terreno, visibilidad y hasta capacidad de negociación en la calle. Pérez Cantó y Mó Romero (2005) sitúan el origen de este tipo de espacios en un problema más amplio de la Ilustración: la resistencia de las cátedras universitarias y de las instituciones eclesiásticas a cualquier novedad no sancionada por la tradición obligó a los ilustrados, con o sin apoyo gubernamental, a idear nuevas formas de relacionarse, academias, tertulias, salones y paseos, como instrumentos de difusión de las luces (Pérez Cantó y Mó Romero, 2005). Las mujeres, sobre todo las que habitaban la Corte madrileña, sortearon las dificultades que la sociedad patriarcal de su tiempo les imponía y aprovecharon las pequeñas brechas que la Ilustración abrió en el modelo diseñado para ellas (Pérez Cantó y Mó Romero, 2005). Esa misma razón ilustrada, que se proclamaba principio de liberación universal, justificaba al mismo tiempo la subordinación de las mujeres apelando a la naturaleza, y las excluía de la ciudadanía entendida como el conjunto de derechos ejercidos por una sociedad libre (Pérez Cantó y Mó Romero, 2005). Esta investigación parte de esa tensión: el paseo como escenario donde el discurso de la domesticidad y la práctica de la visibilidad femenina se contradicen constantemente, y donde esa contradicción termina siendo más reveladora que cualquiera de los dos polos por separado.</p>
<p>Franco Rubio (2009) ofrece la clave interpretativa de fondo: antes de la Ilustración, los espacios sociales, la casa, la calle, la plaza, la iglesia, la fuente, el lavadero, no estaban tan tajantemente separados entre público y privado, y la mujer transitaba con relativa normalidad por todos ellos como parte de la sociabilidad comunitaria cotidiana. Fue el propio siglo XVIII el que impuso la dicotomía rígida entre esfera pública, masculina y política, y esfera privada, femenina y doméstica, redefiniendo a la mujer como &quot;criatura doméstica&quot; y excluyéndola, en el plano teórico, de la vida pública (Franco Rubio, 2009). Esto invierte la cronología que uno esperaría intuitivamente. No es que el Antiguo Régimen fuera más cerrado y la Ilustración abriera espacios a la mujer; es casi al revés: la Ilustración inventa la frontera conceptual que después hay que estar cruzando o negociando. El paseo se vuelve interesante precisamente porque es uno de los pocos espacios que la nueva dicotomía no logra clasificar limpiamente, ya que es público en su ubicación, pero funciona con lógicas de trato, cortejo y exhibición que antes pertenecían al ámbito privado del salón o el tocador.</p>
<p>Zabaleta (1660), en El día de fiesta, describe ya a mediados del XVII un paseo que funciona como escenario de cortejo minuciosamente ritualizado: las damas se sientan y los galanes se acercan hablando &quot;como en susurro&quot; (Zabaleta, 1660), y objetos como el abanico o la basquiña sirven de instrumentos estratégicos de coqueteo. Pero junto a esa descripción casi etnográfica, Zabaleta (1660) sostiene el ideal contrario: la mujer, aunque esté físicamente en la calle, debe estar &quot;recogida&quot;, con los párpados bajos, casi ausente de sí misma, comparándola con una tortuga que permanece encerrada dentro de su caparazón en público. Esta doble cara de Zabaleta, el observador que describe con detalle el juego de miradas y el moralista que exige la invisibilidad de la mujer, es en realidad el patrón que se repetirá durante todo el siglo siguiente. No hay una sola voz barroca cerrada contra la que la Ilustración abre; ya en el XVII conviven de forma incómoda la norma del recato y la práctica del paseo galante, lo que matiza cualquier relato demasiado lineal de progreso en la visibilidad femenina. Franco Rubio (2009) añade una dimensión poco explorada: el tiempo femenino. En el Antiguo Régimen, el tiempo de la mujer se concibe como un continuum de trabajo sin pausas; la ociosidad femenina, el llamado tempus vacuum, es denunciada por moralistas y eclesiásticos como antesala del pecado, porque la inactividad debilitaría la voluntad y favorecería la tentación (Franco Rubio, 2009). Frente a esto, la &quot;vida festiva&quot;, bailes, teatro, toros, fiestas, paseos, se convierte en la única grieta legítima por la que las mujeres pueden interrumpir esa rutina. Leído junto con el apartado anterior, esto sugiere que el paseo no competía solo contra la vigilancia moral del cuerpo que exigía Zabaleta, sino contra una economía del tiempo que consideraba sospechoso cualquier minuto femenino no productivo. Ganar el derecho a pasear era, en el fondo, ganar el derecho a tener tiempo propio, algo que hoy nos parece trivial pero que en ese marco discursivo era una reivindicación de fondo, aunque no se formulara en esos términos.</p>
<p>Bolufer (2007) documenta cómo, para pensadores del progreso como John Millar, William Alexander o Condorcet, el grado de libertad y visibilidad pública de las mujeres pasó a leerse como indicador del nivel de civilización de una nación. Viajeros como Alexander Jardine sostenían que el grado de civilización de un país podía medirse por el trato dado a las mujeres, y observadores como Millar interpretaban la creciente presencia española en paseos y sociabilidad mixta como señal de refinamiento, no de decadencia (Bolufer, 2007). Viajeros españoles como Viera y Clavijo o Antonio Ponz, a su vez, registraban con entusiasmo la participación activa de mujeres francesas o inglesas en paseos, espectáculos y salones (Bolufer, 2007). Este es, a mi juicio, el punto más problemático de todo el corpus. La visibilidad femenina se legitima aquí no como un derecho de la mujer en sí misma, sino como un símbolo instrumental del progreso masculino de la nación. La mujer que pasea no gana estatus como sujeto político, de hecho sigue excluida de la ciudadanía, sino que su visibilidad se convierte en una especie de moneda simbólica que sirve para medir el prestigio civilizatorio de los hombres que la rodean. Es una inclusión que, mirada de cerca, sigue siendo profundamente instrumental. El contraejemplo lo da el propio Leandro Fernández de Moratín, que en sus Apuntaciones rechaza explícitamente a la mujer que monta a caballo en los paseos ingleses por parecerle &quot;robusta, rígida y feroz&quot; (Bolufer, 2007): el límite de la visibilidad aceptable se traza justo donde empieza a parecerse a autonomía real y no a mero adorno social.</p>
<p>Bolufer (1998) muestra que el discurso ilustrado intentó &quot;alzar un muro&quot; entre esfera pública y privada, pero que en la práctica el paseo, el teatro, el salón y la tertulia desmentían esa separación día a día. Más interesante aún, la autora sostiene que el cuidado de la moda y la apariencia en el paseo no era vanidad pasiva, sino una estrategia activa de autoafirmación social, un modo de reclamar el derecho a ser vista y a proyectar una identidad propia en el espacio urbano (Bolufer, 1998). Esta idea conecta directamente con Martín Gaite y me parece la más productiva de todo el corpus para construir una hipótesis, porque convierte a la mujer paseante de objeto de la mirada masculina, como en Zabaleta, en sujeto que administra activamente esa mirada a su favor. La diferencia entre ser vista y hacerse ver es sutil pero decisiva, y probablemente sea el eje que mejor distingue el paseo dieciochesco del paseo barroco.</p>
<p>Martín Gaite (1972) documenta cómo el cortejo, o cicisbeo, a mediados del XVIII, permitió a las mujeres casadas de la élite frecuentar regularmente paseo, teatro e iglesia acompañadas por un galán con aprobación social. La autora sustituye el viejo ideal barroco del &quot;recato&quot; por el nuevo valor dieciochesco del &quot;despejo&quot;: soltura, capacidad de conversación, visibilidad sin apuro (Martín Gaite, 1972). Llega incluso a plantear que la polémica social generada por el cortejo fue &quot;la semilla de un primer conato explícito de malestar matrimonial&quot; y el germen de una futura toma de conciencia femenina, aunque minoritaria (Martín Gaite, 1972). Esta es una lectura de largo plazo bastante audaz, casi teleológica, al conectar el cortejo del XVIII con las raíces del feminismo español posterior, y conviene tomarla con cautela: el propio cortejo era una institución que dependía por completo del consentimiento o la tolerancia del marido, y solo estaba al alcance de mujeres casadas de la élite, de modo que no hay que confundir un mayor margen de maniobra dentro del sistema con un cuestionamiento del sistema.</p>
<p>Poniendo toda la información en conjunto, aparecen tres tensiones que, en mi lectura, deberían estructurar la investigación. La primera es la de continuidad frente a ruptura: Zabaleta (1660) ya describe en el XVII el paseo como escenario de cortejo, de modo que lo que cambia en el XVIII no es tanto la práctica como su legitimación discursiva, en términos de civilización y refinamiento, y su institucionalización a través del cortejo como figura social reconocida. La segunda es la de visibilidad como instrumento frente a visibilidad como agencia: los viajeros ilustrados que recoge Bolufer (2007) leen la visibilidad femenina como símbolo del progreso de la nación, una lectura que sigue centrada en el hombre, mientras que Bolufer (1998) y Martín Gaite (1972) permiten leer esa misma visibilidad como estrategia propia de las mujeres para ganar espacio social. Ambas lecturas conviven en las fuentes y no es necesario elegir una, porque probablemente el paseo funcionaba simultáneamente como las dos cosas, según quién narrara la escena. La tercera tensión tiene que ver con el sesgo social del corpus: todo el material reunido aquí habla de mujeres nobles o burguesas, casadas, con acceso a coche, tocador y cortejo, y ninguna de las fuentes aborda a las mujeres populares que, según lo visto en la sesión anterior sobre Nueva España, también acudían al prado o al campo como una suerte de salón al aire libre propio. Si la investigación quiere ser completa, este vacío de clase, y si interesa también el vacío colonial o novohispano, merece señalarse explícitamente como límite del corpus actual.</p>
<p>El resumen, el paseo del siglo XVIII condensa, mejor que casi ningún otro espacio, la contradicción constitutiva de la Ilustración respecto a las mujeres: las declara intelectualmente capaces mientras las confina discursivamente al hogar, y luego les permite, incluso celebra, su presencia en la calle siempre que esa presencia sirva para exhibir el refinamiento colectivo antes que para reclamar autonomía individual. Estudiar el paseo, entonces, no es solo estudiar un espacio urbano, sino estudiar el mecanismo mismo por el cual el siglo XVIII negoció, sin resolver, la contradicción entre su discurso de domesticidad y su práctica de sociabilidad mixta.</p>
<h3>El Teatro</h3>
<p>El uso del teatro en España encontró de esta una herramienta para la difusión de ideas ilustradas, como las buenas costumbres y la formación del ciudadano, tomando como base el teatro neoclásico que consideraban provechoso y educativo, buscando combatir las comedias de mal gusto que fueron presentadas en años anteriores.</p>
<p>Durante la segunda mitad del siglo XVIII impulsado por el Conde de Aranda se lleva a cabo una reforma que buscaba impulsar una modernización en los espacios teatrales, una mejora en la formación de los actores y la búsqueda de un nuevo repertorio que se acercara más a las ideas ilustradas, algunos de los personajes que participaron durante este periodo fueron Clavijo y Fajardo, Nicolas Fernandez de Moratin, Tomas Iriarte, Mariano Nifo, Pablo de Olavide entre otros. Sin embargo la diferencia de posturas entre algunos autores llevó a un conflicto sobre la finalidad del teatro, pues entraba en debate si este servía para divertir o para educar.</p>
<p>La asistencia a estos espacios por mujeres ya era una de las principales formas de entretenimiento en el que podían participar , sin embargo, esta se veía diferenciada por los espacios que ocupaban. Los palcos habían sido reservados para las mujeres de la aristocracia, que eran pequeños compartimentos que se encontraban apilados en diferentes niveles alrededor de la sala, este representaba el poder económico que tenía el esposo y la moda y conocimiento de la esposa, mientras que en las cazuelas que eran para las mujeres populares, situado al fondo de la sala frente del escenario se abría la posibilidad para que estas mujeres mostraran su gusto teatral e incluso pudiesen aplaudir o abuchear al autor que se presentará, estos espacios sirvieron como lugar de esparcimiento y lugar donde poder entablar relaciones.</p>
<p>Algunos de los autores y obras destacadas de la época son:</p>
<p>“EL SÍ DE LAS NIÑAS” obra creada por Leandro Fernández de Moratín ,busco la transformación y el cuestionamiento de viejas costumbres como el caso de los matrimonios arreglados de mujeres jovenes con hombres adultos, la obra escrita en prosa se centra en el matrimonio entre Francisca y don Diego, donde doña Irene madre de la muchacha impulsa este matrimonio con la idea de mejorar su posición económica, sin embargo el verdadero amor de Francisca seria Carlos sobrino de don Diego ,la obra culminaría con la reflexión de don Diego aceptando el amor de ambos jóvenes. Para el autor la comedia debía ser crítica e intelectual reformando determinadas costumbres Españolas.</p>
<p>Don Ramón de la Cruz con su teatro breve con obras como “LA BODA DE CHINITA” que imagina la boda de una mujer gigante y chinita quien era un hombre caracterizado por su baja estatura y su obra “LA OPOSICIÓN AL CORTEJO” donde los personajes don Fausto y doña Elvira expresan los problemas de seguir con los ideales del cortejo. En estas obras se puede apreciar el uso de la sátira como medida para influenciar las costumbres de las mujeres</p>
<h3>Conclusiones</h3>
<p>Finalmente, se concluye dando una breve síntesis del impacto que tuvieron los distintos espacios de sociabilidad surgidos durante el siglo XVIII en la vida y el estatus de las mujeres. La autora nos invita a reflexionar dos ideas sumamente importantes, las cuales son: el primer punto trata sobre el acceso a la educación o al trabajo útil y sobre cómo durante la ilustración no se alteró de forma automática acerca de la subordinación legal ni el sistema patriarcal sobre las mujeres.</p>
<p>El segundo punto nos dice que a pesar de tener una continuidad normativa, la ocupación de nuevos espacios (salones, paseos, prensa y sociabilidad) se formó un antecedente clave en la construcción del feminismo en el largo camino hacia la igualdad y la ciudadanía.</p>
<p>Sobre este tema hay ejemplos en textos de Gloria Franco Rubio, como “El Tratado de la Educación de las Hijas de Fenelón, y La Difusión del Modelo de Mujer en La España del Siglo XVII” y &quot;La Historia de las Mujeres en la Historiografía Modernista Española”. En la primera lectura explica por qué no hubo una ruptura patriarcal y es que la ilustración no buscaba como tal la emancipación de las mujeres, sino hacerlas más “útiles” al estado sin alterar la jerarquía familiar. La claridad del pensamiento de Fenelón en España muestran cómo se articuló un modelo formativo de “ángel del hogar” instruido, es decir, que la educación femenina no era un fin en sí mismo para crear ciudadanas libres, si no un instrumento para formar esposas virtuosas, madres educadores de futuros ciudadanos y eficaces administradoras de la hacienda doméstica. De cierta manera hay un aporte al epílogo ya que le da un soporte teórico e ideológico, demostrando que la literatura pedagógica de la época estaba limitada a los alcances emancipadores de la educación. La segunda lectura hace un balance historiográfico de cómo las investigaciones actuales evalúan el siglo XVIII. Coincide con el epílogo al señalar que el feminismo en España no nació de rupturas abruptas en el siglo XIX, sino que se gestó lenta y paulatinamente en el siglo XVIII a través de la revisión crítica de la tradición, el acceso al mundo y la creación de redes de sociabilidad femenina y sitúa la experiencia de las ilustradas madrileñas dentro de una genealogía histórica más amplia, validando la afirmación de las autoras de que la ilustración, aunque contradictoria, fue la cuna del feminismo contemporáneo.
